title = "Vision Board Web Platform Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Files and patterns explicitly safe to commit"
paths = [
  '''(.*?)\.env\.example''',
  '''(.*?)\.env\.test''',
  '''docs/.*''',
  '''guidelines/.*''',
  '''README.*\.md''',
  '''AGENTS\.md''',
  '''CLAUDE\.md''',
  '''PROMPTS.*\.md''',
  # Fixture/secret giả lập trong test & eval của AI assistant (không phải secret thật)
  '''backend/src/tests/assistant.*\.test\.ts''',
  '''src/app/features/assistant/evals/.*''',
  '''src/app/features/assistant/__tests__/.*''',
]
regexes = [
  # Demo/mock placeholder keys used in docs
  '''sk-(demo|mock|example|xxx)[-_a-zA-Z0-9]*''',
  '''AIza(SyDemoKey|MockKey)[-_a-zA-Z0-9]*''',
  # Exact synthetic Stripe-shaped fixture present in an earlier Coach test commit.
  '''sk_live_AbCdEfGhIjKl[0-9]{9}''',
]
