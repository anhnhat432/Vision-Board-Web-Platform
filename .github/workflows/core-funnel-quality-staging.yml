name: Core funnel quality staging proof

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Accessible demo/staging URL to test
        required: true

permissions:
  contents: read

jobs:
  smoke:
    name: Run core funnel quality staging proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORE_QUALITY_URL: ${{ github.event.inputs.target_url }}
      CORE_QUALITY_SESSION: gha-core-quality-${{ github.run_id }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate target URL
        shell: bash
        run: |
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]; then
            echo "::error::Set repository secret VERCEL_AUTOMATION_BYPASS_SECRET before running protected-preview proof."
            exit 1
          fi

          if [ -z "${CORE_QUALITY_URL}" ]; then
            echo "::error::CORE_QUALITY_URL is required."
            exit 1
          fi

          normalized="$(printf '%s' "${CORE_QUALITY_URL}" | tr '[:upper:]' '[:lower:]')"
          normalized="${normalized%/}"

          if [[ "${normalized}" == *"localhost"* ]] || [[ "${normalized}" == *"127.0.0.1"* ]]; then
            echo "::error::Use an accessible VITE_APP_MODE=demo staging/preview URL for deployed core-funnel proof, not localhost."
            exit 1
          fi

          production_real_mode_urls=("https://vision-board-web-platform.vercel.app" "https://dearourfuture.io.vn")
          for production_url in "${production_real_mode_urls[@]}"; do
            if [ "${normalized}" = "${production_url}" ]; then
              echo "::error::Core quality smoke is local-first/demo-only; use production-smoke-e2e.yml for real-mode production proof."
              exit 1
            fi
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run core funnel quality smoke
        run: npm run smoke:core-quality
