name: npm audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm audit --audit-level=high --omit=dev || (echo "::warning::Frontend has high or critical vulnerabilities in production deps." && exit 1)

  backend:
    name: Backend audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend audit --audit-level=high --omit=dev || (echo "::warning::Backend has high or critical vulnerabilities in production deps." && exit 1)
