name: MVP2 sync staging smoke

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Staging/preview URL to test
        required: true
      skip_auth:
        description: Skip authentication (signed-out guard only)
        required: false
        default: "false"
      cleanup:
        description: Clean up test data after run
        required: false
        default: "true"
      test_prefix:
        description: Custom test data prefix (default auto-generated)
        required: false

permissions:
  contents: read

jobs:
  smoke:
    name: Run MVP2 sync staging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MVP2_SMOKE_URL: ${{ github.event.inputs.target_url }}
      MVP2_SMOKE_EMAIL: ${{ secrets.MVP2_SMOKE_EMAIL }}
      MVP2_SMOKE_PASSWORD: ${{ secrets.MVP2_SMOKE_PASSWORD }}
      MVP2_SMOKE_SKIP_AUTH: ${{ github.event.inputs.skip_auth }}
      MVP2_SMOKE_CLEANUP: ${{ github.event.inputs.cleanup }}
      MVP2_SMOKE_TEST_PREFIX: ${{ github.event.inputs.test_prefix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate env
        shell: bash
        run: |
          if [ -z "${MVP2_SMOKE_URL}" ]; then
            echo "::error::MVP2_SMOKE_URL is required."
            exit 1
          fi
          normalized_url="${MVP2_SMOKE_URL%/}"
          if [[ "${normalized_url}" == *"localhost"* ]] || [[ "${normalized_url}" == *"127.0.0.1"* ]]; then
            echo "::error::Use a staging or production-like URL for MVP2 sync proof, not localhost."
            exit 1
          fi
          if [ "${MVP2_SMOKE_SKIP_AUTH}" != "true" ]; then
            if [ -z "${MVP2_SMOKE_EMAIL}" ] || [ -z "${MVP2_SMOKE_PASSWORD}" ]; then
              echo "::error::Set repository secrets MVP2_SMOKE_EMAIL and MVP2_SMOKE_PASSWORD, or set skip_auth=true."
              exit 1
            fi
          fi

      - name: Run MVP2 sync staging smoke
        run: npm run smoke:mvp2-sync:staging
