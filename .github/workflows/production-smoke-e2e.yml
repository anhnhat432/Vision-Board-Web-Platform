name: Production smoke e2e

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: Production URL to smoke test
        required: false
        default: https://vision-board-web-platform.vercel.app

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    name: Run production smoke e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD_SMOKE_URL: ${{ github.event.inputs.target_url || 'https://vision-board-web-platform.vercel.app' }}
      PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
      PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
      PROD_SMOKE_FRESH_EMAIL: ${{ secrets.PROD_SMOKE_FRESH_EMAIL }}
      PROD_SMOKE_FRESH_PASSWORD: ${{ secrets.PROD_SMOKE_FRESH_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate QA credentials
        shell: bash
        run: |
          if [ -z "${PROD_SMOKE_EMAIL}" ] || [ -z "${PROD_SMOKE_PASSWORD}" ]; then
            echo "::error::Set repository secrets PROD_SMOKE_EMAIL and PROD_SMOKE_PASSWORD before running production smoke e2e."
            exit 1
          fi

      - name: Wait for Vercel production deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Vercel production deployment for commit ${GITHUB_SHA}."

          for attempt in {1..72}; do
            deployment_id="$(
              gh api \
                --method GET \
                "repos/${GITHUB_REPOSITORY}/deployments" \
                -f ref="${GITHUB_SHA}" \
                -f environment="Production" \
                --jq '.[] | select(.creator.login == "vercel[bot]") | .id' \
                | head -n 1
            )"

            if [ -n "${deployment_id}" ]; then
              deployment_status="$(
                gh api \
                  "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                  --jq '.[0].state // ""'
              )"
              deployment_url="$(
                gh api \
                  "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                  --jq '.[0].environment_url // .[0].target_url // ""'
              )"

              echo "Attempt ${attempt}: deployment ${deployment_id} status=${deployment_status:-unknown} url=${deployment_url:-n/a}"

              case "${deployment_status}" in
                success)
                  echo "Vercel production deployment is ready."
                  exit 0
                  ;;
                failure|error|inactive)
                  echo "::error::Vercel production deployment ended with status ${deployment_status}."
                  exit 1
                  ;;
              esac
            else
              echo "Attempt ${attempt}: no Vercel production deployment found yet."
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for Vercel production deployment for ${GITHUB_SHA}."
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run production smoke e2e
        run: npm run smoke:prod
