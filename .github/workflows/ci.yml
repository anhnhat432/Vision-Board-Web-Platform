name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  backend:
    name: Backend check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Seed backend test env
        run: |
          {
            echo "NODE_ENV=test"
            echo "MONGODB_URI=mongodb://127.0.0.1:27017/vision-board-ci"
            echo "FIREBASE_PROJECT_ID=vision-board-ci"
            echo "FIREBASE_CLIENT_EMAIL=firebase-adminsdk-ci@vision-board-ci.iam.gserviceaccount.com"
            echo "FRONTEND_ORIGIN=https://example.com"
            echo "FIREBASE_PRIVATE_KEY<<EOF"
            node -e "const { generateKeyPairSync } = require('crypto'); const { privateKey } = generateKeyPairSync('rsa', { modulusLength: 2048 }); process.stdout.write(privateKey.export({ type: 'pkcs8', format: 'pem' }));"
            echo "EOF"
          } >> "$GITHUB_ENV"
      - run: npm --prefix backend ci
      - run: npm --prefix backend run typecheck
      - run: npm --prefix backend run build
      - run: npm --prefix backend test
