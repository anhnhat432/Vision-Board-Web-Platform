name: LWW e2e staging

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Staging/preview URL to test
        required: true
      allow_overwrite:
        description: Type OVERWRITE_TEST_WORKSPACE to allow LWW overwrite scenarios
        required: true

permissions:
  contents: read

jobs:
  lww:
    name: Run LWW e2e against staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LWW_E2E_URL: ${{ github.event.inputs.target_url }}
      LWW_E2E_ALLOW: ${{ github.event.inputs.allow_overwrite }}
      LWW_E2E_EMAIL: ${{ secrets.LWW_E2E_EMAIL }}
      LWW_E2E_PASSWORD: ${{ secrets.LWW_E2E_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate LWW staging credentials
        shell: bash
        run: |
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]; then
            echo "::error::Set repository secret VERCEL_AUTOMATION_BYPASS_SECRET before running protected-preview proof."
            exit 1
          fi

          if [ -z "${LWW_E2E_URL}" ]; then
            echo "::error::target_url is required."
            exit 1
          fi
          if [[ "${LWW_E2E_URL}" =~ ^https?://(localhost|127\.0\.0\.1)(:|/|$) ]]; then
            echo "::error::Use a staging or production-like URL for LWW proof, not localhost."
            exit 1
          fi
          if [ "${LWW_E2E_ALLOW}" != "OVERWRITE_TEST_WORKSPACE" ]; then
            echo "::error::Set allow_overwrite input to OVERWRITE_TEST_WORKSPACE."
            exit 1
          fi
          if [ -z "${LWW_E2E_EMAIL}" ] || [ -z "${LWW_E2E_PASSWORD}" ]; then
            echo "::error::Set repository secrets LWW_E2E_EMAIL and LWW_E2E_PASSWORD before running LWW e2e staging."
            exit 1
          fi
          if [[ ! "${LWW_E2E_EMAIL}" =~ (^|[+._-])lww([+._-]|@) ]]; then
            echo "::error::LWW_E2E_EMAIL must be a dedicated overwrite-safe address containing +lww, .lww, _lww, or -lww."
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run LWW scenarios sequentially
        shell: bash
        run: |
          scenario_failed=0

          run_scenario() {
            local scenario_slug="$1"
            local scenario_title="$2"

            if ! LWW_E2E_RUN_ID="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${scenario_slug}" \
              PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/${scenario_slug}" \
              PLAYWRIGHT_HTML_OPEN=never \
              npx playwright test e2e/sync-lww.spec.ts \
                --grep "${scenario_title}" \
                --retries=0 \
                --output="test-results/${scenario_slug}"; then
              scenario_failed=1
            fi
          }

          run_scenario "local-wins" "local wins when local mutation is newer"
          sleep 65
          run_scenario "cloud-wins" "cloud wins when cloud is newer"
          sleep 65
          run_scenario "tombstone" "tombstone wins over pending mutation"

          exit "${scenario_failed}"

      - name: Upload LWW Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lww-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
