services:
  - type: web
    name: vision-board-backend
    env: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BILLING_PROVIDER
        value: casso
      - key: BILLING_REPOSITORY
        value: mongo
      - key: CASSO_WEBHOOK_SECRET
        sync: false
      - key: CASSO_BANK_ACCOUNT
        sync: false
      - key: CASSO_BANK_NAME
        sync: false
      - key: CASSO_ACCOUNT_NAME
        sync: false
      - key: PLUS_PRICE_VND
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
