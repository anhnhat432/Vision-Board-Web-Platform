services:
  - type: web
    name: vision-board-backend
    env: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BILLING_PROVIDER
        value: casso
      - key: BILLING_REPOSITORY
        value: mongo
      - key: BILLING_PAID_DISABLED
        value: "true"
      - key: CASSO_WEBHOOK_SECRET
        sync: false
      - key: CASSO_BANK_ACCOUNT
        sync: false
      - key: CASSO_BANK_NAME
        sync: false
      - key: CASSO_ACCOUNT_NAME
        sync: false
      - key: PLUS_PRICE_VND
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      # PayOS billing (when BILLING_PROVIDER=payos)
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: PAYOS_RETURN_URL
        sync: false
      - key: PAYOS_CANCEL_URL
        sync: false
      # AI Assistant
      - key: AI_PROVIDER
        value: groq
      - key: ASSISTANT_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_SMART_MODEL
        value: gemini-3.1-flash-lite
      # Email notifications
      - key: EMAIL_PROVIDER
        value: disabled
      - key: BILLING_SUPPORT_EMAIL
        sync: false
      # R2 backup (optional)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
